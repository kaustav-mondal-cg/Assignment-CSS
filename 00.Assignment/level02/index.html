<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body.bg {
    min-height: 100vh;
    background: #1c1c1c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 12px;
}

.calc {
    width: 100%;
    max-width: 320px;
}

.dsp {
    color: #fff;
    font-size: clamp(42px, 14vw, 70px);
    font-weight: 300;
    text-align: right;
    padding: 0 8px 16px;
    line-height: 1;
}

.pad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.btn {
    aspect-ratio: 1;
    border: none;
    border-radius: 50%;
    font-size: clamp(18px, 5.5vw, 26px);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    width: 100%;
    padding: 0;
}

.fn {
    background: #a5a5a5;
    color: #000;
}

.nm {
    background: #333333;
    color: #fff;
}

.op {
    background: #ff9f0a;
    color: #fff;
    font-size: clamp(22px, 6.5vw, 32px);
}

.zero {
    grid-column: span 2;
    aspect-ratio: auto;
    height: 100%;
    border-radius: 50px;
    justify-content: flex-start;
    padding-left: 24px;
}

@media (max-width: 360px) {
    .pad {
        gap: 8px;
    }

    .zero {
        padding-left: 18px;
    }
}
    </style>
</head>
<body class="bg">
    <div class="calc">
        <div class="dsp">7744</div>
        <div class="pad">
            <button class="btn fn">C</button>
            <button class="btn fn">+/-</button>
            <button class="btn fn">%</button>
            <button class="btn op">&divide;</button>
            <button class="btn nm">7</button>
            <button class="btn nm">8</button>
            <button class="btn nm">9</button>
            <button class="btn op">&times;</button>
            <button class="btn nm">4</button>
            <button class="btn nm">5</button>
            <button class="btn nm">6</button>
            <button class="btn op">&minus;</button>
            <button class="btn nm">1</button>
            <button class="btn nm">2</button>
            <button class="btn nm">3</button>
            <button class="btn op">&#43;</button>
            <button class="btn nm zero">0</button>
            <button class="btn nm">,</button>
            <button class="btn op">&#61;</button>
        </div>
    </div>
</body>

</html>
